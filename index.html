<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="מיפוי חתולי רחוב בתל אביב-יפו: סריקה, דיווחי מצוקה, אימוץ ונתוני אמת לפי אזור.">
<meta name="theme-color" content="#d9731c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CityCat">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>html,body{height:100%;margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>CityCat · חתולי תל אביב</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700;800&display=swap">
<style>
/* Layout: one-column phone app (max 520px) — header, live view, bottom tab bar. White-City paper, sea ink, ginger accent. */
:root{
  --paper:#f3f6f5; --card:#ffffff; --ink:#10283a; --mute:#5f7180; --line:#dbe3e6;
  --sea:#1f6f93; --sea-soft:#d7e9f1; --land:#eef2ee; --land-2:#e3eae3;
  --ginger:#d9731c; --ginger-soft:#fbe6d2; --leaf:#2b8a63; --leaf-soft:#d8efe4;
  --alert:#cc3b2a; --alert-soft:#f9dcd7; --mourn:#565b63; --mourn-soft:#e6e7ea; --amber:#c99412;
  --f-display:"Secular One","Assistant",system-ui,sans-serif;
  --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e1820; --card:#16232d; --ink:#e6eef2; --mute:#94a6b2; --line:#26384449;
  --sea:#4aa2c8; --sea-soft:#14303f; --land:#15212a; --land-2:#1b2a34;
  --ginger:#f08f3a; --ginger-soft:#3a2614; --leaf:#4cc08e; --leaf-soft:#123326;
  --alert:#f0604d; --alert-soft:#3d1a15; --mourn:#a7adb6; --mourn-soft:#262b31; --amber:#e3b33c; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1820; --card:#16232d; --ink:#e6eef2; --mute:#94a6b2; --line:#26384449;
  --sea:#4aa2c8; --sea-soft:#14303f; --land:#15212a; --land-2:#1b2a34;
  --ginger:#f08f3a; --ginger-soft:#3a2614; --leaf:#4cc08e; --leaf-soft:#123326;
  --alert:#f0604d; --alert-soft:#3d1a15; --mourn:#a7adb6; --mourn-soft:#262b31; --amber:#e3b33c; color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.app{direction:rtl;max-width:520px;height:100%;margin:0 auto;display:grid;grid-template-rows:auto 1fr auto;background:var(--paper);position:relative;overflow:hidden}
@media (min-width:560px){.app{border-inline:1px solid var(--line)}}
header.top{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--card)}
.logo{font-family:var(--f-display);font-size:21px;line-height:1;display:flex;align-items:center;gap:8px}
.logo svg{width:30px;height:30px}
.sponsor{font-size:11.5px;color:var(--mute);line-height:1.2}
.sponsor b{color:var(--ink)}
.pts{margin-inline-start:auto;background:var(--ginger-soft);color:var(--ginger);font-weight:800;border-radius:999px;padding:4px 12px;font-variant-numeric:tabular-nums;white-space:nowrap;border:0}
main{overflow:auto;position:relative;min-height:0;display:flex;flex-direction:column}
.view{display:none}
.view.on{display:block;flex:1 0 auto}
.pad{padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;padding:8px 2px 10px;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--mute)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on svg{color:var(--ginger)}
nav.tabs .scanbtn{position:relative;top:-14px}
nav.tabs .scanbtn span.ring{width:58px;height:58px;border-radius:50%;background:var(--ginger);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px #d9731c55}
nav.tabs .scanbtn span.ring svg{width:28px;height:28px;color:#fff}
h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;text-wrap:balance}
h3{font-size:16px;margin:0;font-weight:800}
p{margin:0}
.muted{color:var(--mute)}
.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ginger{background:var(--ginger);color:#fff}
.btn.alert{background:var(--alert);color:#fff}
.btn.leaf{background:var(--leaf);color:#fff}
.btn.mourn{background:var(--mourn);color:var(--paper)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;background:var(--land-2);color:var(--ink);white-space:nowrap}
.chip.leaf{background:var(--leaf-soft);color:var(--leaf)}
.chip.ginger{background:var(--ginger-soft);color:var(--ginger)}
.chip.alert{background:var(--alert-soft);color:var(--alert)}
.chip.mourn{background:var(--mourn-soft);color:var(--mourn)}
.chip.sea{background:var(--sea-soft);color:var(--sea)}
.demo-flag{font-size:12px;background:var(--sea-soft);color:var(--sea);padding:6px 12px;text-align:center}
/* MAP */
#v-map.on{flex:1 1 0;min-height:0;position:relative}
.mapwrap{position:absolute;inset:0;background:var(--sea-soft);touch-action:none;overflow:hidden}
#map{width:100%;height:100%;display:block;cursor:grab;user-select:none}
#map:active{cursor:grabbing}
.layers{position:absolute;top:10px;right:max(10px,env(safe-area-inset-right,0px));left:max(10px,env(safe-area-inset-left,0px));display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.layers::-webkit-scrollbar{display:none}
.layers button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;box-shadow:0 2px 6px #0001}
.layers button i{width:10px;height:10px;border-radius:50%;display:inline-block}
.layers button[aria-pressed="false"]{opacity:.55;box-shadow:none}
.zoom{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:84px;display:grid;gap:6px}
.zoom button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:20px;font-weight:700}
.fab{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:16px;left:max(14px,env(safe-area-inset-left,0px));display:flex;gap:8px;justify-content:space-between;align-items:center;pointer-events:none}
.fab>*{pointer-events:auto}
.fab .btn{box-shadow:0 6px 16px #0003;padding:13px 18px}
.legend{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:62%}
.legend span{display:inline-flex;gap:4px;align-items:center}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.pickhint{position:absolute;top:52px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
@keyframes pulse{0%{r:6;opacity:.7}100%{r:22;opacity:0}}
.pulse{animation:pulse 1.6s ease-out infinite}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:.3}}
/* SHEET */
.backdrop{position:absolute;inset:0;background:#0006;z-index:1100}
.sheet{position:absolute;inset:auto 0 0 0;z-index:1101;background:var(--card);border-radius:20px 20px 0 0;max-height:88%;overflow:auto;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -8px 30px #0003}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet .x{float:left;border:0;background:var(--land-2);border-radius:50%;width:32px;height:32px;font-size:18px;line-height:1}
.stack{display:grid;gap:12px}
/* ID CARD (Israeli teudat-zehut feel) */
.tz{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(160deg,var(--sea-soft),var(--card) 55%)}
.tz-head{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--sea);color:#fff;font-size:12px;font-weight:700;letter-spacing:.04em}
.tz-body{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:12px}
.tz-photo{width:96px;height:118px;border-radius:10px;background:var(--land-2);overflow:hidden;display:grid;place-items:center}
.tz-photo img{width:100%;height:100%;object-fit:cover}
.tz-photo svg{width:70px;height:70px}
.tz dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px;min-width:0}
.tz dt{color:var(--mute)}
.tz dd{margin:0;font-weight:700;min-width:0;overflow-wrap:anywhere}
.tz-num{font-family:var(--f-display);font-size:22px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.tz-foot{padding:6px 12px 10px;font-size:12px;color:var(--mute);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
/* SCAN */
.cam{position:relative;border-radius:18px;overflow:hidden;background:#0b1217;aspect-ratio:3/4;max-width:100%;display:grid;place-items:center;color:#fff}
.cam video,.cam img.shot{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.reticle{position:absolute;inset:14%;border-radius:22px;border:3px solid #ffffffcc;box-shadow:0 0 0 999px #0005}
.reticle::after{content:"";position:absolute;left:6%;right:6%;height:2px;background:var(--ginger);top:10%;animation:sweep 2s ease-in-out infinite alternate;box-shadow:0 0 12px var(--ginger)}
@keyframes sweep{to{top:90%}}
@media (prefers-reduced-motion:reduce){.reticle::after{animation:none;top:50%}}
.camlabel{position:absolute;bottom:14px;left:12px;right:12px;text-align:center;font-weight:700;text-shadow:0 1px 4px #000}
.campick{display:grid;gap:10px;justify-items:center;padding:24px;text-align:center}
.steps{display:grid;gap:6px;font-size:13.5px}
.steps div{display:flex;gap:8px;align-items:center}
.steps i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
.steps .done i{background:var(--leaf);border-color:var(--leaf)}
.steps .run i{border-color:var(--ginger);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* REPORT */
.rep-grid{display:grid;gap:10px}
.rep{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;text-align:start;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px}
.rep .ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center}
.rep .ic svg{width:28px;height:28px}
.rep b{display:block;font-size:16px}
.rep span{font-size:13px;color:var(--mute)}
.rep.sad{background:var(--mourn-soft);border-color:transparent}
label.f{display:grid;gap:4px;font-size:13px;font-weight:700}
input[type=text],select,textarea{font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--paper);color:var(--ink);width:100%}
textarea{min-height:70px;resize:vertical}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:10px 6px;font-weight:700;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
/* FEED */
.post{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.post .ph{aspect-ratio:4/3;background:var(--land-2);display:grid;place-items:center;max-width:100%}
.post .ph img{width:100%;height:100%;object-fit:cover}
.post .ph svg{width:46%;height:auto}
.post .meta{padding:10px 12px;display:grid;gap:6px}
.post .acts{display:flex;gap:6px;align-items:center}
.like{border:0;background:var(--land-2);border-radius:999px;padding:5px 12px;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.like[aria-pressed="true"]{background:var(--alert-soft);color:var(--alert)}
.sponsor-card{background:var(--leaf-soft);border:0}
.sponsor-card h3{color:var(--leaf)}
/* GAME */
.game-top{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-variant-numeric:tabular-nums}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hole{aspect-ratio:1;border-radius:16px;background:var(--land-2);position:relative;overflow:hidden;border:0;padding:0}
.hole .spot{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:11.5px;color:var(--mute);font-weight:700}
.hole .who{position:absolute;inset:8% 14% 22%;transform:translateY(110%);transition:transform .14s ease-out}
.hole.up .who{transform:translateY(0)}
.hole.hit{background:var(--leaf-soft)}
.hole.bad{background:var(--alert-soft)}
.hole svg{width:100%;height:100%}
/* PROFILE / ADMIN */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-family:var(--f-display);font-size:24px;font-weight:400;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{font-size:12.5px;color:var(--mute)}
.lb{display:grid;gap:4px}
.lb div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--mute);font-weight:700;background:var(--land)}
.bar{height:8px;border-radius:4px;background:var(--land-2);position:relative;overflow:hidden;min-width:70px}
.bar i{position:absolute;inset:0 0 0 auto;border-radius:4px}
.bar::after{content:"";position:absolute;top:-2px;bottom:-2px;right:75%;width:2px;background:var(--ink);opacity:.5}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{border-radius:12px;padding:8px 10px;background:var(--land-2);font-size:12.5px;font-weight:700;display:flex;gap:6px;align-items:center}
.badge.off{opacity:.4}
.toast{position:absolute;top:64px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:700;z-index:1200;box-shadow:0 8px 24px #0004;max-width:90%;text-align:center}
.tabs2{display:flex;gap:6px;overflow-x:auto}
.tabs2 button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px}
.tabs2 button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.qitem{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.qitem:last-child{border-bottom:0}

/* MAGIC REVEAL + AVATAR */
.tz-photo{position:relative}
.tz-photo svg.av{width:100%;height:100%}
.tz-real{position:absolute;width:38px!important;height:38px!important;bottom:4px;left:4px;border-radius:50%!important;border:2px solid var(--card);object-fit:cover}
.av .tail{transform-origin:146px 190px;animation:wag 1.4s ease-in-out infinite alternate}
.av .head{animation:bob 3.2s ease-in-out infinite}
.av .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes wag{from{transform:rotate(-6deg)}to{transform:rotate(8deg)}}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 2px}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.magic{position:relative;height:300px;border-radius:20px;overflow:hidden;background:radial-gradient(circle at 50% 45%,#2a4f66,#0d1b24 70%);display:grid;place-items:center}
.m-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:suck .7s cubic-bezier(.6,0,.8,.4) forwards}
@keyframes suck{0%{transform:scale(1);filter:none;opacity:1;border-radius:0}70%{opacity:1}100%{transform:scale(.08) rotate(200deg);filter:blur(6px) brightness(2);opacity:0;border-radius:50%}}
.m-orb{position:absolute;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle,#fff,#f5c542 45%,transparent 70%);opacity:0;animation:orb .7s .45s ease-out forwards}
@keyframes orb{0%{opacity:0;transform:scale(.3)}40%{opacity:1;transform:scale(2.2)}100%{opacity:0;transform:scale(6)}}
.m-sparks{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.m-sparks span{grid-area:1/1;width:9px;height:9px;border-radius:50%;background:var(--c);opacity:0;animation:spark .9s calc(.55s + var(--d)) ease-out forwards;color:#f5c542;font-size:18px;line-height:9px;text-align:center}
.m-sparks span.paw{background:none;width:auto;height:auto}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.2)}}
.m-avatar{width:190px;max-width:60%;opacity:0;animation:pop .7s .75s cubic-bezier(.2,1.6,.4,1) forwards;filter:drop-shadow(0 10px 18px #0007)}
@keyframes pop{0%{opacity:0;transform:scale(.2) rotate(-25deg) translateY(30px)}100%{opacity:1;transform:none}}
.m-name{position:absolute;bottom:14px;font-family:var(--f-display);font-size:26px;color:#fff;text-shadow:0 2px 0 var(--ginger),0 4px 12px #0008;opacity:0;animation:rise .5s 1.25s ease-out forwards}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card3d{perspective:900px}
.card3d .tilt{transition:transform .15s ease-out;transform-style:preserve-3d}
.card3d .flip{position:relative;transform-style:preserve-3d;animation:flipin .9s 1.2s cubic-bezier(.3,1.3,.5,1) both}
@keyframes flipin{from{transform:rotateY(180deg) scale(.9)}to{transform:rotateY(0)}}
.card3d .face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.card3d .back{position:absolute;inset:0;transform:rotateY(180deg)}
.cardback{height:100%;border-radius:16px;background:linear-gradient(135deg,var(--ginger),#f5c542);display:grid;place-items:center;align-content:center;gap:4px;color:#fff;font-family:var(--f-display);font-size:22px}
.cardback svg{width:54px;height:54px}
.cardback span{font-family:var(--f-body);font-size:13px;font-weight:700;opacity:.85}
.face.refresh .tz{animation:shine .8s ease-out}
@keyframes shine{0%{box-shadow:0 0 0 0 #f5c54200}30%{box-shadow:0 0 0 6px #f5c54299}100%{box-shadow:0 0 0 0 #f5c54200}}
.magic.still *{animation:none!important;opacity:1}
.magic.still .m-photo,.magic.still .m-orb,.magic.still .m-sparks{display:none}
@media (prefers-reduced-motion:reduce){.av *,.card3d .flip{animation:none!important}}

/* SPLASH: a cat takes a selfie, the flash turns it into the logo */
.splash{position:absolute;inset:0;z-index:1300;background:radial-gradient(circle at 50% 42%,var(--ginger-soft),var(--paper) 70%);display:grid;place-items:center;animation:spOut .45s 2.55s ease-in forwards;cursor:pointer}
.sp-stage{position:relative;width:240px;height:260px}
.sp-cat{position:absolute;inset:0;animation:spCat 1.3s ease-in-out forwards}
.sp-phone{position:absolute;width:62px;right:-6px;top:44px;transform-origin:20% 90%;animation:spPhone 1.1s ease-in-out forwards}
.sp-flash{position:absolute;inset:0;background:#fff;opacity:0;animation:spFlash .5s 1.05s ease-out forwards;pointer-events:none}

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>window.REAL_MAP = true; window.PWA = true;</script>
<script>
document.documentElement.lang = "he";
document.documentElement.dir = "rtl";

/* ---------- geography (schematic Tel Aviv-Yafo) ---------- */
const BBOX = { n: 32.150, s: 32.010, w: 34.735, e: 34.855 };
const W = 800, H = 1100;
const px = (lat, lng) => [ (lng - BBOX.w) / (BBOX.e - BBOX.w) * W, (BBOX.n - lat) / (BBOX.n - BBOX.s) * H ];
const unpx = (x, y) => [ BBOX.n - y / H * (BBOX.n - BBOX.s), BBOX.w + x / W * (BBOX.e - BBOX.w) ];
const COAST = [[32.150,34.790],[32.125,34.784],[32.105,34.776],[32.090,34.770],[32.078,34.766],[32.066,34.762],[32.058,34.758],[32.050,34.752],[32.040,34.748],[32.028,34.746],[32.010,34.743]];
function coastLng(lat){
  for (let i = 0; i < COAST.length - 1; i++){
    const [a1,b1] = COAST[i], [a2,b2] = COAST[i+1];
    if (lat <= a1 && lat >= a2) return b1 + (b2 - b1) * (a1 - lat) / (a1 - a2);
  }
  return COAST[COAST.length-1][1];
}
const DISTRICTS = [
  { id:"A", name:"צפון-מערב", sub:"רמת אביב, הנמל, תל ברוך", n:32.145, s:32.100, w:"coast", e:34.808 },
  { id:"B", name:"צפון-מזרח", sub:"רמת החייל, נווה שרת, אפקה", n:32.145, s:32.100, w:34.808, e:34.850 },
  { id:"C", name:"הצפון הישן", sub:"בן יהודה, דיזנגוף צפון", n:32.100, s:32.080, w:"coast", e:34.786 },
  { id:"D", name:"הצפון החדש", sub:"בבלי, כיכר המדינה, צמרות", n:32.100, s:32.080, w:34.786, e:34.828 },
  { id:"E", name:"לב העיר", sub:"רוטשילד, כרם התימנים, שינקין", n:32.080, s:32.058, w:"coast", e:34.786 },
  { id:"F", name:"מזרח העיר", sub:"יד אליהו, ביצרון, נחלת יצחק", n:32.080, s:32.050, w:34.786, e:34.828 },
  { id:"G", name:"דרום העיר", sub:"נווה צדק, פלורנטין, שפירא", n:32.058, s:32.035, w:34.770, e:34.786 },
  { id:"H", name:"דרום-מזרח", sub:"התקווה, כפר שלם, ניר אביב", n:32.050, s:32.025, w:34.786, e:34.820 },
  { id:"J", name:"יפו", sub:"העיר העתיקה, עג׳מי, יפו ד׳", n:32.058, s:32.015, w:"coast", e:34.770 },
];
const DIST = Object.fromEntries(DISTRICTS.map(d => [d.id, d]));
function distPoly(d){
  const pts = [];
  if (d.w === "coast"){
    const steps = 6;
    for (let i = 0; i <= steps; i++){ const lat = d.n - (d.n - d.s) * i / steps; pts.push([lat, coastLng(lat)]); }
    pts.push([d.s, d.e], [d.n, d.e]);
  } else pts.push([d.n, d.w], [d.s, d.w], [d.s, d.e], [d.n, d.e]);
  return pts;
}
function distCenter(d){ const w = d.w === "coast" ? coastLng((d.n + d.s) / 2) + 0.004 : d.w; return [(d.n + d.s) / 2, (w + d.e) / 2]; }
function districtAt(lat, lng){
  for (const d of DISTRICTS){
    const w = d.w === "coast" ? coastLng(lat) : d.w;
    if (lat <= d.n && lat >= d.s && lng >= w && lng <= d.e) return d.id;
  }
  return null;
}
function randInDistrict(d, r){
  const lat = d.s + (d.n - d.s) * (0.12 + r() * 0.76);
  const w = d.w === "coast" ? coastLng(lat) + 0.002 : d.w;
  return [lat, w + (d.e - w) * (0.1 + r() * 0.8)];
}

/* ---------- vocab ---------- */
const COLORS = [
  { name:"ג׳ינג׳י", hex:"#d9822b" }, { name:"שחור", hex:"#24272b" }, { name:"לבן", hex:"#f1efe9" },
  { name:"אפור", hex:"#8a9299" }, { name:"טאבי חום", hex:"#8b6a4a" }, { name:"שלושה צבעים", hex:"#c48a4a" },
  { name:"שחור-לבן", hex:"#4a4d52" }, { name:"קרם", hex:"#e3c89a" },
];
const HEALTH = ["בריא","נזלת או דלקת עיניים","פצע או חתך","גזזת או בעיית עור","רזון","צליעה","בהריון"];
const NAMES = ["מיצי","שוקו","פלפל","לימון","טוסט","קפה","פרנקו","זהבה","שמנת","ג׳ינג׳ר","פיסטוק","בורקס","חומוס","מלפפון","רוטשילד","דיזי","יפית","שושי","טיגריס","קינמון","צ׳יקו","לולה","נמר","סבתא","פיתה","מנגו","שקשוקה","גוגו","בובה","אריה","פוקצ׳ה","צימוקי","זוזו","פנינה","אוזו","בייגלה","חלבה","ריבה","קיווי","מוקה"];
const SPOTS_TXT = ["ליד פח הכתום","בחצר אחורית","מתחת לרכב","על גדר","ליד פינת האכלה","בכניסה לבניין","בגינה הציבורית","ליד השוק"];
const MARKS = ["גרב לבן ברגל ימין","זנב קצר","כתם שחור על האף","עין אחת ירוקה ואחת צהובה","פרווה ארוכה","אוזן שמאל חתוכה (מעוקר)","פס לבן על החזה","שפם לבן בולט","קצה זנב לבן"];

/* ---------- demo data (used only when the shared store is unavailable) ---------- */
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const BASE = Date.parse("2026-10-24T09:00:00Z");
function demoData(){
  const r = rng(1983), pick = a => a[Math.floor(r() * a.length)];
  const weights = { A:6, B:4, C:8, D:5, E:10, F:7, G:9, H:6, J:9 };
  const neuterBias = { A:.78, B:.8, C:.7, D:.72, E:.66, F:.55, G:.5, H:.42, J:.48 };
  const cats = [], reports = [], stations = [];
  let n = 101;
  for (const d of DISTRICTS){
    for (let i = 0; i < weights[d.id]; i++){
      const c = pick(COLORS), [lat, lng] = randInDistrict(d, r);
      const neutered = r() < neuterBias[d.id];
      const h = r() < .74 ? "בריא" : pick(HEALTH.slice(1));
      const first = BASE - Math.floor(r() * 300) * 864e5, last = BASE - Math.floor(r() * 20) * 864e5 - Math.floor(r()*12)*36e5;
      cats.push({ id:"TLV-0" + (n++), name: NAMES[(n * 7) % NAMES.length], color:c.name, hex:c.hex,
        pattern: r() < .4 ? "טאבי" : "אחיד", marks: neutered ? "אוזן שמאל חתוכה (מעוקר)" : pick(MARKS.filter(m => !m.includes("חתוכה"))),
        sex: pick(["נקבה","זכר","לא ידוע"]), age: pick(["בוגר","בוגר","צעיר","גור"]), neutered, health:h,
        district:d.id, lat, lng, firstSeen:first, lastSeen:Math.max(first,last), sightings: 1 + Math.floor(r() * 14),
        photo:null, likes:{}, notes:"", demo:true });
    }
    for (let i = 0; i < (d.id === "B" ? 1 : 2); i++){ const [lat, lng] = randInDistrict(d, r); stations.push({ id:"st-" + d.id + i, lat, lng, district:d.id, caretaker:"מאכיל/ה רשום/ה", cats: 4 + Math.floor(r()*12), demo:true }); }
  }
  const sickCat = cats.find(c => c.health === "פצע או חתך") || cats[3];
  reports.push({ id:"rp-1", type:"distress", lat:sickCat.lat + .0008, lng:sickCat.lng, district:sickCat.district, created:BASE - 3*36e5, status:"פתוח", desc:"חתול עם פצע ברגל, צולע, ליד הפח", catId:sickCat.id, demo:true });
  const [l2a, l2b] = randInDistrict(DIST.G, r);
  reports.push({ id:"rp-2", type:"distress", lat:l2a, lng:l2b, district:"G", created:BASE - 26*36e5, status:"בטיפול", desc:"גורים בלי אמא בחניון", demo:true });
  const [l3a, l3b] = randInDistrict(DIST.E, r);
  reports.push({ id:"rp-3", type:"body", lat:l3a, lng:l3b, district:"E", created:BASE - 2*36e5, status:"נשלח לתברואה", desc:"חתול שנדרס בצד הכביש", demo:true });
  const trail = (d, k) => { const out = []; let [la, lo] = randInDistrict(d, r); for (let i = 0; i < k; i++){ out.push({ lat:la, lng:lo, t:BASE - (k - i) * 18 * 6e4 }); la += (r() - .5) * .006; lo += (r() - .5) * .006; } return out; };
  const t1 = trail(DIST.C, 4), t2 = trail(DIST.H, 3);
  reports.push({ id:"rp-4", type:"dog", dogKind:"lost", lat:t1[3].lat, lng:t1[3].lng, district:"C", created:t1[0].t, status:"פתוח", desc:"גולדן צעיר עם קולר אדום, בורח מאנשים", trail:t1, demo:true });
  reports.push({ id:"rp-5", type:"dog", dogKind:"abandoned", lat:t2[2].lat, lng:t2[2].lng, district:"H", created:t2[0].t, status:"פתוח", desc:"כלבה מעורבת בינונית, רזה, בלי קולר. מסתובבת ליד המרכז המסחרי", trail:t2, demo:true });
  return { cats, reports, stations };
}

/* ---------- state ---------- */
const S = {
  cats:[], reports:[], stations:[], players:{}, me:{ points:0, scans:0, newCats:0, reports:0, games:0, best:0 },
  uid:null, db:null, sample:null, user:null, admin:false, demo:true, names:{},
  pick:null, picking:null, view:"map",
  layers:{ cats:true, distress:true, dogs:true, feed:true, sick:false, unneutered:false, bodies:true, density:false },
};
const store = {
  get(k, d){ try { const v = localStorage.getItem("catstlv:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem("catstlv:" + k, JSON.stringify(v)); } catch {} },
};
const use = n => (window.claude && window.claude.use) ? window.claude.use(n).catch(() => null) : Promise.resolve(null);

/* ---------- writes (shared store, or local in demo mode) ---------- */
async function put(col, doc){
  const arr = S[col];
  const i = arr.findIndex(x => x.id === doc.id);
  if (i >= 0) arr[i] = doc; else arr.push(doc);
  if (S.db){ try { await S.db.collection(col).doc(doc.id).set(strip(doc)); } catch (e){ toast(writeErr(e)); } }
  else saveLocal();
  renderAll();
}
async function del(col, id){
  S[col] = S[col].filter(x => x.id !== id);
  if (S.db){ try { await S.db.collection(col).doc(id).delete(); } catch (e){ toast(writeErr(e)); } }
  else saveLocal();
  renderAll();
}
function strip(o){ return JSON.parse(JSON.stringify(o)); }
function writeErr(e){ return e && e.code === "permission_denied" ? "אין לך הרשאת כתיבה. בקש מבעל האפליקציה גישת משתתף." : e && e.code === "quota_exceeded" ? "המאגר מלא. מנהל האזור צריך לפנות רשומות ישנות." : "השמירה לא הצליחה. נסה שוב בעוד רגע."; }
function saveLocal(){ store.set("demo", { cats:S.cats, reports:S.reports, stations:S.stations }); }
async function addPoints(n, field){
  S.me.points += n; if (field) S.me[field] = (S.me[field] || 0) + 1;
  renderPts();
  if (S.db && S.uid){ try { await S.db.collection("players").doc(S.uid).set({ ...S.me, uid:S.uid, updated:Date.now() }); } catch {} }
  else store.set("me", S.me);
}

/* ---------- utilities ---------- */
const $ = s => document.querySelector(s);

/* ---------- cartoon avatar generator: one look per cat, seeded by its ID ---------- */
function hashStr(s){ let h = 2166136261; for (const ch of String(s)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function shade(hex, f){ const n = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)); return "#" + n.map(v => Math.round(f < 0 ? v * (1 + f) : v + (255 - v) * f).toString(16).padStart(2, "0")).join(""); }
function catAvatar(c){
  const h = hashStr(c.id), r = rng(h);
  const base = c.hex || "#d9822b", dark = shade(base, -.38), light = shade(base, .5);
  const eye = ["#7cc35a","#f2c53d","#6fb7e6","#e39a2b","#9fd36b"][h % 5];

  const calico = c.color === "שלושה צבעים", tux = c.color === "שחור-לבן";
  const chest = tux || /חזה|לבן/.test(marks) || r() < .35, sock = /גרב/.test(marks), longFur = /ארוכה/.test(marks), shortTail = /זנב קצר/.test(marks), tailTip = /קצה זנב/.test(marks);
  const odd = /עין אחת/.test(marks), noseSpot = /כתם שחור על האף/.test(marks);

  const white = "#fbf8f2";
  const tip = c.neutered === true;
  const leftEar = tip ? `M58 70 L66 ${70 - earH + 8} L76 ${70 - earH + 4} L90 58Z` : `M58 70 L70 ${70 - earH} L90 58Z`;
  const rightEar = `M142 70 L130 ${70 - earH} L110 58Z`;
  const stripes = tabby ? `<path d="M88 52q12 8 24 0M84 62q16 9 32 0M93 44q7 4 14 0" stroke="${dark}" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M56 92h14M54 102h14M130 92h14M132 102h14" stroke="${dark}" stroke-width="4.5" stroke-linecap="round"/>` : "";
  const patches = calico ? `<path d="M60 70q20-20 40-14q-4 26-30 34q-12-4-10-20z" fill="#2b2522"/><path d="M118 58q22 0 26 26q-16 8-28-6z" fill="#d9822b"/>` : "";
  const mask = tux ? `<path d="M76 100q24 34 48 0q-4 26-24 28q-20-2-24-28z" fill="${white}"/>` : "";
  const bodyStripes = tabby ? `<path d="M70 150q8-6 16 0M114 150q8-6 16 0M66 168q10-6 20 0M114 168q10-6 20 0" stroke="${dark}" stroke-width="5" fill="none" stroke-linecap="round"/>` : "";
  const tail = shortTail ? `M146 188 q22 -4 20 -24` : `M146 190 q46 -6 34 -60 q-6 -18 -16 -12`;
  return `<svg class="av" viewBox="0 0 200 230" aria-label="אווטר של ${esc(c.name)}" role="img">
    <ellipse cx="100" cy="222" rx="62" ry="7" fill="#0002"/>
    <g class="tail"><path d="${tail}" stroke="${calico ? "#2b2522" : base}" stroke-width="${longFur ? 20 : 15}" fill="none" stroke-linecap="round"/>${tailTip && !shortTail ? `<circle cx="166" cy="120" r="8" fill="${white}"/>` : ""}</g>
    <ellipse cx="100" cy="172" rx="${longFur ? 58 : 50}" ry="50" fill="${base}"/>
    ${bodyStripes}
    ${calico ? `<path d="M120 140q26 6 28 34q-20 6-30-10z" fill="#2b2522"/>` : ""}
    ${chest ? `<ellipse cx="100" cy="176" rx="24" ry="34" fill="${white}"/>` : ""}
    <ellipse cx="78" cy="216" rx="17" ry="10" fill="${sock ? white : base}" stroke="${dark}" stroke-width="2"/>
    <ellipse cx="122" cy="216" rx="17" ry="10" fill="${base}" stroke="${dark}" stroke-width="2"/>
    <g class="head" transform="translate(100 92) scale(${wide.toFixed(3)} 1) translate(-100 -92)">
      <path d="${leftEar}" fill="${base}" stroke="${dark}" stroke-width="2" stroke-linejoin="round"/><path d="${rightEar}" fill="${calico ? "#d9822b" : base}" stroke="${dark}" stroke-width="2" stroke-linejoin="round"/>
      <path d="M64 66 L71 ${74 - earH + 10} L84 62Z" fill="#f4a7b4" opacity=".9"/><path d="M136 66 L129 ${74 - earH + 10} L116 62Z" fill="#f4a7b4" opacity=".9"/>
      <ellipse cx="100" cy="94" rx="${longFur ? 54 : 48}" ry="44" fill="${base}" stroke="${dark}" stroke-width="2"/>
      ${patches}${stripes}${mask}

      <g class="eyes">
        <ellipse class="eye" cx="80" cy="90" rx="12" ry="14" fill="#fff" stroke="${ink}" stroke-width="2.5"/><ellipse class="eye" cx="120" cy="90" rx="12" ry="14" fill="#fff" stroke="${ink}" stroke-width="2.5"/>
        <g class="eye"><circle cx="81" cy="92" r="8.5" fill="${eye}"/><ellipse cx="81" cy="92" rx="3.2" ry="6.5" fill="${ink}"/><circle cx="84" cy="88" r="2.6" fill="#fff"/></g>
        <g class="eye"><circle cx="119" cy="92" r="8.5" fill="${odd ? "#6fb7e6" : eye}"/><ellipse cx="119" cy="92" rx="3.2" ry="6.5" fill="${ink}"/><circle cx="122" cy="88" r="2.6" fill="#fff"/></g>
      </g>
      <ellipse cx="66" cy="108" rx="7" ry="4" fill="#ff8fa3" opacity=".45"/><ellipse cx="134" cy="108" rx="7" ry="4" fill="#ff8fa3" opacity=".45"/>
      <path d="M94 104h12l-6 6z" fill="${noseSpot ? ink : "#e86f86"}" stroke="${ink}" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M100 110v4q-5 6-11 2M100 114q5 6 11 2" stroke="${ink}" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path d="M74 108H50M74 113l-22 6M126 108h24M126 113l22 6" stroke="${tux || c.color === "שחור" ? "#ddd" : ink}" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>
    </g>
    <path d="M70 132q30 12 60 0" stroke="var(--ginger)" stroke-width="7" fill="none" stroke-linecap="round"/>
    <circle cx="100" cy="144" r="11" fill="#f5c542" stroke="#b8860b" stroke-width="2"/><text x="100" y="148" text-anchor="middle" font-size="8.5" font-weight="800" fill="#5a4300" font-family="Assistant,sans-serif">${esc(String(c.id).slice(-4))}</text>
  </svg>`;
}

/* ---------- real basemap (presentation build): Google Maps with a key, OpenStreetMap without ---------- */
const RM = { on:false, kind:null, map:null, el:null, suppress:0 };
function gmKey(){ return store.get("gmkey", "") || new URLSearchParams(location.search).get("gmkey") || ""; }
function makeOverlaySvg(){
  const el = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  el.setAttribute("viewBox", `0 0 ${W} ${H}`); el.setAttribute("preserveAspectRatio", "none");
  el.setAttribute("class", "rm-svg"); el.innerHTML = `<g id="dens"></g><g id="mk"></g>`;
  el.addEventListener("click", e => {
    const t = e.target.closest("[data-cat],[data-rep],[data-st]"); if (!t || S.picking) return;
    RM.suppress = Date.now(); e.stopPropagation();
    if (t.dataset.cat) openCat(t.dataset.cat); else if (t.dataset.rep) openReportCard(t.dataset.rep); else openStation(t.dataset.st);
  });
  return el;
}
function rmPick(lat, lng){
  if (Date.now() - RM.suppress < 400) return;
  const d = districtAt(lat, lng);
  if (!d){ toast("המיקום מחוץ לאזורי העיר שבמערכת."); return; }
  S.pick = { lat, lng, district:d }; drawMarkers(); updatePickHint();
  if (S.picking){ const cb = S.picking; S.picking = null; updatePickHint(); cb(); }
}
function rmScale(){ const w = RM.el && RM.el.getBoundingClientRect().width; return w ? 0.77 / (w / W) : 1; }
function initRealMap(){
  const host = document.createElement("div"); host.id = "rmap"; $(".mapwrap").prepend(host);
  $("#map").style.display = "none"; $("#map").innerHTML = "";
  RM.el = makeOverlaySvg(); RM.on = true; svg = RM.el;
  const key = gmKey();
  const src = document.createElement("button"); src.className = "mapsrc"; src.innerHTML = `מפה: <b id="mapSrc">${key ? "טוען Google…" : "OpenStreetMap"}</b>`; src.onclick = openMapSettings; $(".mapwrap").appendChild(src);
  if (key){
    window.__gmReady = () => {
      if (RM.kind === "osm" || RM.kind === "fail") return;
      RM.kind = "google";
      const map = RM.map = new google.maps.Map(host, { center:{ lat:32.078, lng:34.787 }, zoom:13, disableDefaultUI:true, gestureHandling:"greedy", clickableIcons:false });
      class Ov extends google.maps.OverlayView {
        onAdd(){ this.getPanes().overlayMouseTarget.appendChild(RM.el); }
        draw(){ const p = this.getProjection(), sw = p.fromLatLngToDivPixel(new google.maps.LatLng(BBOX.s, BBOX.w)), ne = p.fromLatLngToDivPixel(new google.maps.LatLng(BBOX.n, BBOX.e));
          Object.assign(RM.el.style, { position:"absolute", left:sw.x + "px", top:ne.y + "px", width:(ne.x - sw.x) + "px", height:(sw.y - ne.y) + "px" }); drawMarkers(); }
        onRemove(){ RM.el.remove(); }
      }
      new Ov().setMap(map);
      map.addListener("click", e => rmPick(e.latLng.lat(), e.latLng.lng()));
      map.addListener("zoom_changed", () => setTimeout(drawMarkers, 60));
      $("#mapSrc").textContent = "Google Maps";
    };
    const toOSM = msg => { if (RM.kind === "osm") return; store.set("gmkey", ""); RM.kind = "fail"; toast(msg); startOSM(); };
    window.gm_authFailure = () => toOSM("Google Maps דורש מפתח עם חיוב פעיל. עברתי למפה החינמית.");
    const s = document.createElement("script"); s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&callback=__gmReady&language=he&region=IL&loading=async`; s.async = true; s.onerror = () => toOSM("Google Maps לא נטען. עברתי למפה החינמית."); document.head.appendChild(s);
    setTimeout(() => { if (RM.kind !== "google") toOSM("Google Maps לא נטען. עברתי למפה החינמית."); }, 8000);
  } else startOSM();
}
function startOSM(){
  if (!window.L){ fallbackSchematic(); return; }
  document.getElementById("rmap")?.remove();
  const host = document.createElement("div"); host.id = "rmap"; $(".mapwrap").prepend(host);
  RM.kind = "osm";
  const map = RM.map = L.map(host, { zoomControl:false, attributionControl:true }).setView([32.078, 34.787], 13);
  // Keyless providers. OSM's own server needs a Referer, so a file opened from disk starts on Esri.
  const PROVIDERS = [
    { name:"OpenStreetMap", url:"https://tile.openstreetmap.org/{z}/{x}/{y}.png", opt:{ maxZoom:19, attribution:"© OpenStreetMap contributors" } },
    { name:"Esri", url:"https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", opt:{ maxZoom:19, attribution:"Tiles © Esri, HERE, Garmin, © OpenStreetMap contributors" } },
  ];
  if (location.protocol === "file:") PROVIDERS.reverse();
  let idx = 0, layer = null;
  const useProvider = i => {
    if (i >= PROVIDERS.length){ fallbackSchematic("המפה האמיתית לא נטענה. עברתי למפה הסכמטית."); return; }
    idx = i; if (layer) map.removeLayer(layer);
    const pr = PROVIDERS[i]; let ok = 0, bad = 0;
    layer = L.tileLayer(pr.url, pr.opt).addTo(map);
    layer.on("tileload", () => ok++);
    layer.on("tileerror", () => { bad++; if (bad >= 6 && !ok && idx === i) useProvider(i + 1); });
    setTimeout(() => { if (!ok && idx === i && RM.kind === "osm") useProvider(i + 1); }, 7000);
    const ms = $("#mapSrc"); if (ms) ms.textContent = pr.name;
  };
  useProvider(0);
  L.svgOverlay(RM.el, [[BBOX.s, BBOX.w], [BBOX.n, BBOX.e]], { interactive:false }).addTo(map);
  map.on("click", e => rmPick(e.latlng.lat, e.latlng.lng));
  map.on("zoomend", drawMarkers);
  setTimeout(drawMarkers, 50);
}
function fallbackSchematic(msg){
  if (!RM.on) return;
  try { RM.map && RM.map.remove && RM.map.remove(); } catch {}
  document.getElementById("rmap")?.remove(); document.querySelector(".mapsrc")?.remove();
  RM.on = false; RM.kind = null; RM.map = null; svg = $("#map"); svg.style.display = "";
  drawBase(); fitVB(); drawMarkers(); if (msg) toast(msg);
}
function openMapSettings(){
  sheet(`<div class="stack"><h2>מפת Google</h2>
    <p class="small">כדי להציג את Google Maps צריך מפתח API של Maps JavaScript (נוצר ב-Google Cloud Console). המפתח נשמר רק בדפדפן הזה.</p>
    <label class="f">מפתח API<input type="text" id="gmk" value="${esc(gmKey())}" placeholder="AIza…" dir="ltr"></label>
    <div class="row"><button class="btn ginger" id="gmSave">שמור והחלף למפת Google</button><button class="btn ghost" id="gmClear">חזרה ל-OpenStreetMap</button></div></div>`, s => {
    s.querySelector("#gmSave").onclick = () => { store.set("gmkey", s.querySelector("#gmk").value.trim()); location.reload(); };
    s.querySelector("#gmClear").onclick = () => { store.set("gmkey", ""); location.reload(); };
  });

/* ---------- MAP ---------- */
let svg = $("#map");
let vb = { x:150, y:220, w:520, h:715 };
function fitVB(){
  if (RM.on){ if (RM.kind === "osm") RM.map.invalidateSize(); return; }
  const r = svg.getBoundingClientRect(); if (!r.width) return;
  vb.h = vb.w * r.height / r.width; applyVB();
}
function applyVB(){ if (RM.on) return drawMarkers(); svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); drawMarkers(); }
const k = () => RM.on ? rmScale() : vb.w / 520; // marker scale
function polyPath(pts){ return "M" + pts.map(p => px(p[0], p[1]).map(v => v.toFixed(1)).join(",")).join("L") + "Z"; }

function drawBase(){
  const land = [[BBOX.n, coastLng(BBOX.n)]];
  for (const c of COAST) land.push(c);
  land.push([BBOX.s, BBOX.e], [BBOX.n, BBOX.e]);
  const coastLine = "M" + COAST.map(c => px(c[0], c[1]).join(",")).join("L");
  const yarkon = [[32.101,34.776],[32.100,34.785],[32.102,34.795],[32.104,34.805],[32.101,34.815],[32.099,34.830],[32.101,34.855]];
  const ayalon = [[32.150,34.806],[32.110,34.799],[32.085,34.792],[32.065,34.789],[32.045,34.790],[32.010,34.795]];
  const line = pts => "M" + pts.map(p => px(p[0], p[1]).join(",")).join("L");
  let g = `<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="var(--line)" stroke-width=".6"/></pattern></defs>
  <rect x="-400" y="-400" width="${W+800}" height="${H+800}" fill="var(--sea-soft)"/>
  <path d="${polyPath(land)}" fill="var(--land)"/>
  <path d="${polyPath(land)}" fill="url(#grid)" opacity=".7"/>
  <g id="dens"></g>`;
  for (const d of DISTRICTS){
    g += `<path d="${polyPath(distPoly(d))}" fill="none" stroke="var(--mute)" stroke-opacity=".45" stroke-width="1.2" stroke-dasharray="5 4"/>`;
  }
  g += `<path d="${line(yarkon)}" fill="none" stroke="var(--sea)" stroke-opacity=".55" stroke-width="7" stroke-linecap="round"/>
  <path d="${line(ayalon)}" fill="none" stroke="var(--mute)" stroke-opacity=".3" stroke-width="5"/>
  <path d="${coastLine}" fill="none" stroke="var(--sea)" stroke-width="2" stroke-opacity=".6"/>`;
  const sea = px(32.085, 34.745);
  g += `<text x="${sea[0]}" y="${sea[1]}" fill="var(--sea)" font-size="18" font-weight="700" transform="rotate(-78 ${sea[0]} ${sea[1]})" text-anchor="middle" opacity=".7">הים התיכון</text>`;
  const yk = px(32.1035, 34.822);
  g += `<text x="${yk[0]}" y="${yk[1]}" fill="var(--sea)" font-size="11" font-weight="700" opacity=".8">ירקון</text>`;
  const ay = px(32.072, 34.7915);
  g += `<text x="${ay[0]}" y="${ay[1]}" fill="var(--mute)" font-size="10" font-weight="700" opacity=".8" transform="rotate(-84 ${ay[0]} ${ay[1]})">איילון</text>`;
  for (const d of DISTRICTS){
    const [x, y] = px(...distCenter(d));
    g += `<text x="${x}" y="${y}" text-anchor="middle" fill="var(--ink)" opacity=".5" font-size="15" font-weight="800" font-family="Assistant,sans-serif">${d.name}</text>`;
  }
  g += `<g id="mk"></g>`;
  svg.innerHTML = g;
}
function distStats(){
  const out = {};
  for (const d of DISTRICTS) out[d.id] = { cats:0, neut:0, known:0, sick:0, open:0 };
  for (const c of S.cats){ const s = out[c.district]; if (!s) continue; s.cats++; if (c.neutered !== null && c.neutered !== undefined){ s.known++; if (c.neutered) s.neut++; } if (c.health && c.health !== "בריא") s.sick++; }
  for (const r of S.reports){ const s = out[r.district]; if (s && !["טופל","נאסף","נמצא הבעלים","הועבר לכלבייה"].includes(r.status)) s.open++; }
  return out;
}
const neutColor = p => p >= .75 ? "var(--leaf)" : p >= .5 ? "var(--amber)" : "var(--alert)";
let dogAnims = [];
function drawMarkers(){
  const mk = document.getElementById("mk"), dens = document.getElementById("dens");
  if (!mk) return;
  const s = k(); let g = "";
  if (S.layers.density){
    const st = distStats(); const max = Math.max(1, ...Object.values(st).map(v => v.cats));
    dens.innerHTML = DISTRICTS.map(d => { const v = st[d.id]; const p = v.known ? v.neut / v.known : 0; return `<path d="${polyPath(distPoly(d))}" fill="${neutColor(p)}" fill-opacity="${(.12 + .38 * v.cats / max).toFixed(2)}"/>`; }).join("");
  } else dens.innerHTML = "";
  if (S.layers.feed) for (const st of S.stations){ const [x, y] = px(st.lat, st.lng); g += `<g data-st="${esc(st.id)}" style="cursor:pointer"><rect x="${x-6*s}" y="${y-6*s}" width="${12*s}" height="${12*s}" rx="${3*s}" fill="var(--card)" stroke="var(--sea)" stroke-width="${2*s}"/><path d="M${x-3.5*s} ${y-1*s}h${7*s}l-${1.2*s} ${3.5*s}h-${4.6*s}z" fill="var(--sea)"/></g>`; }
  for (const c of S.cats){
    const unneut = c.neutered === false, sick = c.health && c.health !== "בריא";
    const show = S.layers.cats || (S.layers.unneutered && unneut) || (S.layers.sick && sick);
    if (!show) continue;
    if (S.layers.unneutered && !S.layers.cats && !unneut) continue;
    const [x, y] = px(c.lat, c.lng);
    if (S.layers.sick && sick) g += `<circle cx="${x}" cy="${y}" r="${13*s}" fill="var(--alert)" fill-opacity=".22"/>`;
    const ring = c.neutered ? "var(--leaf)" : c.neutered === false ? "var(--ginger)" : "var(--mute)";
    g += `<g data-cat="${esc(c.id)}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="${12*s}" fill="transparent"/><circle cx="${x}" cy="${y}" r="${6.5*s}" fill="${c.hex || "#999"}" stroke="${ring}" stroke-width="${3*s}"/></g>`;
  }
  const open = r => !["טופל","נאסף","נמצא הבעלים","הועבר לכלבייה"].includes(r.status);
  for (const r of S.reports){
    if (!open(r)) continue;
    const [x, y] = px(r.lat, r.lng);

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
function placeDogs(t){
  for (const r of dogAnims){
    const el = svg.querySelector(`[data-dog="${CSS.escape(r.id)}"]`); if (!el) continue;
    const pts = r.trail.map(p => px(p.lat, p.lng));
    let x, y;
    if (reduceMotion || pts.length === 1){
      [x, y] = pts[pts.length - 1];
      if (!reduceMotion){ const a = t / 900; x += Math.cos(a) * 6 * k(); y += Math.sin(a * 1.3) * 4 * k(); }
    } else {
      const seg = 1800, total = seg * (pts.length - 1) + 1400, u = (t % total);
      if (u >= seg * (pts.length - 1)) [x, y] = pts[pts.length - 1];
      else { const i = Math.floor(u / seg), f = (u % seg) / seg, e = f * f * (3 - 2 * f); x = pts[i][0] + (pts[i+1][0] - pts[i][0]) * e; y = pts[i][1] + (pts[i+1][1] - pts[i][1]) * e; }
    }
    el.setAttribute("transform", `translate(${x},${y})`);
  }
}
(function loop(t){ if (S.view === "map" && dogAnims.length) placeDogs(t); requestAnimationFrame(loop); })(0);

let drag = null; const pointers = new Map();
svg.addEventListener("pointerdown", e => { svg.setPointerCapture(e.pointerId); pointers.set(e.pointerId, { x:e.clientX, y:e.clientY }); drag = { x:e.clientX, y:e.clientY, vx:vb.x, vy:vb.y, moved:false, target:e.target }; if (pointers.size === 2){ const [a, b] = [...pointers.values()]; drag.pinch = Math.hypot(a.x - b.x, a.y - b.y); drag.w = vb.w; } });
svg.addEventListener("pointermove", e => {
  if (!drag) return; pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  const r = svg.getBoundingClientRect(), sc = vb.w / r.width;
  if (pointers.size === 2 && drag.pinch){ const [a, b] = [...pointers.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); zoomTo(drag.w * drag.pinch / d); drag.moved = true; return; }
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 5) drag.moved = true;
  if (drag.moved){ vb.x = drag.vx - dx * sc; vb.y = drag.vy - dy * sc; svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
});
svg.addEventListener("pointerup", e => {
  pointers.delete(e.pointerId);
  if (!drag) return;
  if (!drag.moved){
    const t = drag.target.closest ? drag.target.closest("[data-cat],[data-rep],[data-st]") : null;
    if (t && !S.picking){ if (t.dataset.cat) openCat(t.dataset.cat); else if (t.dataset.rep) openReportCard(t.dataset.rep); else openStation(t.dataset.st); }
    else {
      const r = svg.getBoundingClientRect();
      const x = vb.x + (e.clientX - r.left) / r.width * vb.w, y = vb.y + (e.clientY - r.top) / r.height * vb.h;
      const [lat, lng] = unpx(x, y); const d = districtAt(lat, lng);
      if (!d){ toast("המיקום מחוץ לגבולות העיר. בחר נקודה ביבשה."); }
      else { S.pick = { lat, lng, district:d }; drawMarkers(); updatePickHint(); if (S.picking){ const cb = S.picking; S.picking = null; updatePickHint(); cb(); } }
    }
  }
  drag = null;
});
svg.addEventListener("pointercancel", e => { pointers.delete(e.pointerId); drag = null; });
svg.addEventListener("wheel", e => { e.preventDefault(); zoomTo(vb.w * (e.deltaY > 0 ? 1.15 : 0.87)); }, { passive:false });
function zoomTo(w){ w = Math.max(120, Math.min(900, w)); const cx = vb.x + vb.w / 2, cy = vb.y + vb.h / 2, ratio = vb.h / vb.w; vb.w = w; vb.h = w * ratio; vb.x = cx - w / 2; vb.y = cy - vb.h / 2; applyVB(); }

$("#zin").onclick = () => RM.on ? (RM.kind === "google" ? RM.map.setZoom(RM.map.getZoom() + 1) : RM.map.zoomIn()) : zoomTo(vb.w * .75);

async function startCam(){

    camStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment" }, audio:false });
  } catch {
    camStream = null;
    // The viewer blocked live video: fall back to the phone's camera app. It opens right away and the scan runs as soon as the photo returns.
    $("#camFile").click();
    return;
  }
  const cam = $("#cam");
  cam.innerHTML = `<video autoplay playsinline muted></video><div class="reticle"></div><div class="camlabel" id="camLbl">מחפש חתול… החזק את הטלפון יציב</div>`;
  const v = cam.querySelector("video"); v.srcObject = camStream;
  const c = document.createElement("canvas"); c.width = 32; c.height = 32; const cx = c.getContext("2d", { willReadFrequently:true });
  let prev = null, steady = 0, started = Date.now();

    if (!v.videoWidth) return;
    cx.drawImage(v, 0, 0, 32, 32); const d = cx.getImageData(0, 0, 32, 32).data;
    let diff = 0; if (prev) for (let i = 0; i < d.length; i += 16) diff += Math.abs(d[i] - prev[i]);

    }
  }, 300);
}
async function analyzeFile(file){
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }).catch(() => null);
  if (!img){ toast("לא הצלחתי לקרוא את התמונה. נסה תמונה אחרת."); return; }
  const f = document.createElement("canvas"); const sc = Math.min(1, 900 / Math.max(img.width, img.height));
  f.width = Math.round(img.width * sc); f.height = Math.round(img.height * sc); f.getContext("2d").drawImage(img, 0, 0, f.width, f.height);

function nearbyCats(loc){
  const near = { A:["A","B","C"], B:["B","A","D"], C:["C","A","D","E"], D:["D","B","C","F"], E:["E","C","F","G","J"], F:["F","D","E","H"], G:["G","E","J","H"], H:["H","F","G"], J:["J","G","E"] }[loc.district] || [loc.district];
  return S.cats.filter(c => near.includes(c.district)).sort((a, b) => b.lastSeen - a.lastSeen).slice(0, 120);
}
async function aiAnalyze(blob, loc){

}
/* Visual fingerprint: 4x4 grid of mean colours over the centre of the frame + a 12-bin hue histogram. 60 numbers, computed in a few ms. */
function fingerprint(canvas){
  const c = document.createElement("canvas"); c.width = 24; c.height = 24; const x = c.getContext("2d", { willReadFrequently:true });
  const w = canvas.width, h = canvas.height; x.drawImage(canvas, w * .2, h * .2, w * .6, h * .6, 0, 0, 24, 24);
  const d = x.getImageData(0, 0, 24, 24).data, fp = [], hist = new Array(12).fill(0);
  for (let gy = 0; gy < 4; gy++) for (let gx = 0; gx < 4; gx++){
    let r = 0, g = 0, b = 0, n = 0;
    for (let yy = gy * 6; yy < gy * 6 + 6; yy++) for (let xx = gx * 6; xx < gx * 6 + 6; xx++){ const i = (yy * 24 + xx) * 4; r += d[i]; g += d[i+1]; b += d[i+2]; n++; }
    fp.push(Math.round(r / n), Math.round(g / n), Math.round(b / n));
  }
  for (let i = 0; i < d.length; i += 4){ const r = d[i], g = d[i+1], b = d[i+2], mx = Math.max(r, g, b), mn = Math.min(r, g, b); if (mx - mn < 25) continue; let hh = mx === r ? (g - b) / (mx - mn) : mx === g ? 2 + (b - r) / (mx - mn) : 4 + (r - g) / (mx - mn); hh = (hh * 60 + 360) % 360; hist[Math.floor(hh / 30)]++; }
  const tot = hist.reduce((a, b) => a + b, 0) || 1;
  return fp.concat(hist.map(v => Math.round(v / tot * 255)));
}
function fpDist(a, b){ if (!a || !b || a.length !== b.length) return 999; let s = 0; for (let i = 0; i < a.length; i++) s += Math.abs(a[i] - b[i]); return s / a.length; }
function localAnalyze(canvas, loc){
  const fp = fingerprint(canvas);
  let r = 0, g = 0, b = 0; for (let i = 15; i < 33; i += 3){ r += fp[i]; g += fp[i+1]; b += fp[i+2]; } r /= 6; g /= 6; b /= 6;
  const hex2 = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  let best = COLORS[0], bd = 1e9; for (const col of COLORS.slice(0, 5).concat(COLORS[7])){ const [R, G, B] = hex2(col.hex); const dd = (R - r) ** 2 + (G - g) ** 2 + (B - b) ** 2; if (dd < bd){ bd = dd; best = col; } }
  const near = nearbyCats(loc);
  let m = null, md = 999; for (const c of near){ const dd = fpDist(fp, c.fp); if (dd < md){ md = dd; m = c; } }
  let matchId = null, conf = 0;
  if (m && md < 14){ matchId = m.id; conf = Math.max(.8, 1 - md / 40); }
  else { const cand = near.find(x => x.color === best.name && x.district === loc.district); if (cand){ matchId = cand.id; conf = .5; } }
  return { isCat:true, fp, color:best.name, pattern:"", marks:"", sex:"לא ידוע", age:"בוגר", earTipped:null, health:"בריא", distress:false, matchId, matchConfidence:conf, nameSuggestion:NAMES[Math.floor(Math.random() * NAMES.length)], summary:"" };
}

/* ---------- GAME: "ספירת לילה" whack-a-cat ---------- */
const GSPOTS = ["פח כתום","גג","ספסל","חצר","מכסה ביוב","שוק","קיוסק","גדר","רכב"];
let G = null;
function renderGameIdle(){
  $("#gamePad").innerHTML = `
    <div><h2>ספירת לילה</h2><p class="muted small">30 שניות של ספירה בשכונה. הקש על כל חתול שקופץ כדי לסרוק אותו. חתול עם אוזן חתוכה כבר מעוקר ושווה בונוס. אל תקיש על הכלב.</p></div>
    <div class="card game-top"><span>זמן: <span id="gTime">30</span></span><span>נספרו: <span id="gScore">0</span></span><span class="muted small">שיא: ${S.me.best || 0}</span></div>
    <div class="board" id="board">${GSPOTS.map((s, i) => `<button class="hole" data-i="${i}" aria-label="${s}"><div class="who"></div><span class="spot">${s}</span></button>`).join("")}</div>
    <button class="btn ginger block" id="gStart">התחל ספירה</button>`;
  $("#gStart").onclick = startGame;
  $("#board").querySelectorAll(".hole").forEach(h => h.onclick = () => whack(h));
}
function startGame(){
  if (G) return;
  G = { t:30, score:0, up:{} };
  $("#gStart").disabled = true; $("#gStart").textContent = "סופרים…";
  G.clock = setInterval(() => { G.t--; $("#gTime").textContent = G.t; if (G.t <= 0) endGame(); }, 1000);
  const spawn = () => {
    if (!G) return;
    const free = [...document.querySelectorAll(".hole:not(.up)")]; if (free.length){
      const h = free[Math.floor(Math.random() * free.length)];
      const dog = Math.random() < .16, tip = !dog && Math.random() < .25, col = COLORS[Math.floor(Math.random() * COLORS.length)].hex;
      h.dataset.kind = dog ? "dog" : tip ? "tip" : "cat";
      h.querySelector(".who").innerHTML = dog ? dogSvg() : catSvg(col) + (tip ? "" : "");
      if (tip) h.querySelector(".who").insertAdjacentHTML("beforeend", `<span class="chip leaf" style="position:absolute;top:-4px;right:-4px;font-size:10px">מעוקר</span>`);
      h.classList.add("up"); h.classList.remove("hit", "bad");
      const life = Math.max(550, 1100 - (30 - G.t) * 18);
      setTimeout(() => h.classList.remove("up"), life);
    }
    G.spawn = setTimeout(spawn, Math.max(320, 720 - (30 - G.t) * 12));
  };
  spawn();
}
function whack(h){
  if (!G || !h.classList.contains("up")) return;
  h.classList.remove("up");
  if (h.dataset.kind === "dog"){ G.score = Math.max(0, G.score - 2); h.classList.add("bad"); }
  else { G.score += h.dataset.kind === "tip" ? 2 : 1; h.classList.add("hit"); }
  $("#gScore").textContent = G.score;
  setTimeout(() => h.classList.remove("hit", "bad"), 250);
}
function endGame(){
  clearInterval(G.clock); clearTimeout(G.spawn);
  const score = G.score; G = null;
  const pts = Math.min(15, Math.floor(score / 2));
  if (score > (S.me.best || 0)) S.me.best = score;
  addPoints(pts, "games");
  sheet(`<div class="stack" style="text-align:center;justify-items:center"><div style="width:90px">${catSvg("#d9822b")}</div><h2>ספרת ${score} חתולים!</h2><p class="muted">קיבלת ${pts} נקודות למיפוי. בעולם האמיתי, כל סריקה כזו עוזרת לעמותה לדעת איפה לעקר.</p><button class="btn ginger" id="gAgain">עוד סיבוב</button></div>`, s => { s.querySelector("#gAgain").onclick = () => { closeSheet(); renderGameIdle(); }; });
  renderGameIdle();
}

  const tabs = `<div class="tabs2"><button data-at="stats" aria-pressed="${adminTab === "stats"}">נתונים</button><button data-at="queue" aria-pressed="${adminTab === "queue"}">דיווחים (${tot.open})</button><button data-at="cats" aria-pressed="${adminTab === "cats"}">מאגר חתולים</button><button data-at="vols" aria-pressed="${adminTab === "vols"}">מתנדבים</button><button data-at="adopt" aria-pressed="${adminTab === "adopt"}">אימוץ</button></div>`;
  let body = "";
  if (adminTab === "stats"){
    body = `<div class="kpis">
      <div class="kpi"><b>${tot.cats}</b><span>חתולים במאגר</span></div>
      <div class="kpi"><b style="color:${neutColor(tot.known ? tot.neut / tot.known : 0)}">${tot.known ? Math.round(tot.neut / tot.known * 100) : 0}%</b><span>מעוקרים (יעד 75%)</span></div>
      <div class="kpi"><b>${tot.sick}</b><span>חולים או פצועים</span></div>
      <div class="kpi"><b>${tot.open}</b><span>דיווחים פתוחים</span></div></div>
      <div class="tablewrap"><table><thead><tr><th>אזור</th><th>חתולים</th><th>מעוקרים</th><th></th><th>חולים</th><th>פתוחים</th></tr></thead><tbody>
      ${DISTRICTS.map(d => { const v = st[d.id], p = v.known ? v.neut / v.known : 0; return `<tr><td><b>${d.name}</b></td><td>${v.cats}</td><td>${Math.round(p * 100)}%</td><td><div class="bar"><i style="width:${Math.round(p * 100)}%;background:${neutColor(p)}"></i></div></td><td>${v.sick}</td><td>${v.open}</td></tr>`; }).join("")}
      </tbody></table></div>
      <p class="small muted">הקו בכל עמודה מסמן את סף ה-75% שמעליו האוכלוסייה מפסיקה לגדול. אזורים באדום הם עדיפות ראשונה לתור העיקורים.</p>`;
  } else if (adminTab === "queue"){
    const open = [...S.reports].sort((a, b) => b.created - a.created);
    const opts = { distress:["פתוח","בטיפול","טופל"], dog:["פתוח","הועבר לכלבייה","נמצא הבעלים"], body:["נשלח לתברואה","נאסף"] };
    body = open.length ? open.map(r => `<div class="qitem"><div class="row" style="justify-content:space-between"><span class="row"><span class="chip ${r.type === "body" ? "mourn" : r.type === "dog" ? "" : "alert"}">${REP_LABEL[r.type]}</span>${r.urgency === "דחופה" ? `<span class="chip alert">דחוף</span>` : ""}</span><span class="small muted">${fmtAgo(r.created)} · ${esc(DIST[r.district]?.name)}</span></div>
      <p class="small">${esc(r.desc)}</p>
      <div class="row"><select data-status="${esc(r.id)}" aria-label="סטטוס" style="width:auto">${opts[r.type].map(o => `<option ${o === r.status ? "selected" : ""}>${o}</option>`).join("")}</select><button class="btn ghost" data-goto="${esc(r.id)}" style="padding:8px 12px">במפה</button><button class="btn ghost" data-delrep="${esc(r.id)}" style="padding:8px 12px">מחק</button></div></div>`).join("") : `<p class="small muted">אין דיווחים.</p>`;
  } else if (adminTab === "cats"){
    const list = S.cats.filter(c => adminDist === "all" || c.district === adminDist).sort((a, b) => b.lastSeen - a.lastSeen);
    body = `<select id="adDist" aria-label="סינון אזור"><option value="all">כל האזורים</option>${DISTRICTS.map(d => `<option value="${d.id}" ${adminDist === d.id ? "selected" : ""}>${d.name}</option>`).join("")}</select>
      <div class="tablewrap"><table><thead><tr><th>ת.ז</th><th>שם</th><th>אזור</th><th>מעוקר</th><th>בריאות</th><th>לאימוץ</th><th>נראה</th><th></th></tr></thead><tbody>
      ${list.map(c => `<tr><td>${esc(c.id)}</td><td>${esc(c.name)}</td><td>${esc(DIST[c.district]?.name)}</td>
        <td><select data-neut="${esc(c.id)}" aria-label="עיקור"><option value="1" ${c.neutered ? "selected" : ""}>כן</option><option value="0" ${c.neutered === false ? "selected" : ""}>לא</option><option value="" ${c.neutered == null ? "selected" : ""}>?</option></select></td>
        <td><select data-health="${esc(c.id)}" aria-label="בריאות">${HEALTH.map(h => `<option ${h === c.health ? "selected" : ""}>${h}</option>`).join("")}</select></td>
        <td><input type="checkbox" data-adt="${esc(c.id)}" ${isAdoptable(c) ? "checked" : ""} aria-label="מוצע לאימוץ"></td><td>${fmtAgo(c.lastSeen)}</td><td><button class="btn ghost" data-delcat="${esc(c.id)}" style="padding:4px 10px">מחק</button></td></tr>`).join("")}
      </tbody></table></div>
      <p class="small muted">${list.length} רשומות. שינוי נשמר מיד ומתעדכן לכל המשתמשים.</p>`;
  } else if (adminTab === "adopt"){
    body = `<div id="adoptList" class="small muted">טוען…</div>`;
  } else {
    body = `<div id="volList" class="small muted">טוען…</div>`;
  }
  return tabs + `<div class="stack" style="margin-top:4px">${body}</div>`;
}
function bindAdmin(){
  const P = $("#mePad");
  P.querySelectorAll("[data-at]").forEach(b => b.onclick = () => { adminTab = b.dataset.at; renderMe(); });
  P.querySelectorAll("[data-status]").forEach(s => s.onchange = () => { const r = S.reports.find(x => x.id === s.dataset.status); put("reports", { ...r, status:s.value, updated:Date.now() }); toast("הסטטוס עודכן"); });
  P.querySelectorAll("[data-goto]").forEach(b => b.onclick = () => { const r = S.reports.find(x => x.id === b.dataset.goto); go("map"); centerOn(r.lat, r.lng, 220); });
  P.querySelectorAll("[data-delrep]").forEach(b => b.onclick = () => del("reports", b.dataset.delrep));
  P.querySelectorAll("[data-neut]").forEach(s => s.onchange = () => { const c = S.cats.find(x => x.id === s.dataset.neut); put("cats", { ...c, neutered:s.value === "" ? null : s.value === "1" }); });
  P.querySelectorAll("[data-health]").forEach(s => s.onchange = () => { const c = S.cats.find(x => x.id === s.dataset.health); put("cats", { ...c, health:s.value }); });
  P.querySelectorAll("[data-adt]").forEach(x => x.onchange = () => { const c = S.cats.find(y => y.id === x.dataset.adt); put("cats", { ...c, adoptable:x.checked }); });
  P.querySelectorAll("[data-delcat]").forEach(b => b.onclick = () => { if (b.dataset.armed){ del("cats", b.dataset.delcat); } else { b.dataset.armed = 1; b.textContent = "בטוח?"; } });
  const ad = $("#adDist"); if (ad) ad.onchange = () => { adminDist = ad.value; renderMe(); };
  if (adminTab === "vols") loadVols();
  if (adminTab === "adopt") loadAdopt();
}
async function loadAdopt(){
  let list = [];
  if (S.db){ try { list = await loadPrivate("adopt"); } catch {} }
  else list = store.get("adopt", []);
  const el = $("#adoptList"); if (!el) return;
  el.innerHTML = list.length ? list.sort((a, b) => b.created - a.created).map(a => `<div class="qitem" style="color:var(--ink)"><div class="row" style="justify-content:space-between"><b>${esc(a.name)} · ${esc(a.catName || "כל חתול")}</b><span class="chip ${a.route === "עמותה" ? "leaf" : "sea"}">${esc(a.route)}</span></div><p class="small">${esc(a.contact)} · ${esc(a.home)}${a.note ? " · " + esc(a.note) : ""}</p><div class="row"><select data-adst="${esc(a.id)}" aria-label="סטטוס" style="width:auto">${["חדשה","בשיחה","ביקור בית","אומץ","לא מתאים"].map(o => `<option ${o === a.status ? "selected" : ""}>${o}</option>`).join("")}</select><span class="small muted">${fmtAgo(a.created)}</span></div></div>`).join("") : "עוד אין בקשות אימוץ.";
  el.querySelectorAll("[data-adst]").forEach(sel => sel.onchange = async () => {
    const a = list.find(x => x.id === sel.dataset.adst); a.status = sel.value;
    if (S.db){ try { const { _uid, ...body } = a; await S.db.doc(`data/users/${_uid}/${a.id}`).set(body); } catch (e){ toast(writeErr(e)); } } else store.set("adopt", list);
    if (sel.value === "אומץ" && a.catId){ const c = S.cats.find(x => x.id === a.catId); if (c) put("cats", { ...c, adoptable:false, notes:"אומץ/ה " + fmtDate(Date.now()) }); }
    toast("הסטטוס עודכן");
  });
}
async function loadVols(){
  let vols = [];
  if (S.db){ try { vols = await loadPrivate("vol"); } catch {} }
  else vols = store.get("vols", []);
  const el = $("#volList"); if (!el) return;
  el.innerHTML = vols.length ? `<div class="tablewrap"><table><thead><tr><th>שם</th><th>אזור</th><th>תפקיד</th><th>נרשם</th></tr></thead><tbody>${vols.sort((a, b) => b.created - a.created).map(v => `<tr><td>${esc(v.name || "—")}</td><td>${esc(DIST[v.district]?.name)}</td><td>${esc(v.role)}</td><td>${fmtAgo(v.created)}</td></tr>`).join("")}</tbody></table></div>` : "עוד אין מתנדבים רשומים. ההרשמה נמצאת בכרטיס העמותה בפיד.";
}

/* ---------- navigation ---------- */
function go(v){
  S.view = v;
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("on", s.id === "v-" + v));
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  if (v !== "scan") stopCam();
  if (v === "map") requestAnimationFrame(fitVB);
  if (v === "scan" && !$("#scanPad").innerHTML) renderScanIdle();
  if (v === "feed") renderFeed();
  if (v === "game" && !G) renderGameIdle();
  if (v === "me") renderMe();
}
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { if (b.dataset.v === "scan") renderScanIdle(); go(b.dataset.v); });
$("#ptsChip").onclick = () => go("me");
function renderPts(){ $("#ptsChip").textContent = S.me.points + " נק׳"; }
function renderAll(){
  renderPts(); drawMarkers(); renderLegend();
  if (S.view === "feed") renderFeed();
  if (S.view === "me" && !document.activeElement?.closest?.("#mePad select")) renderMe();
}
addEventListener("resize", fitVB);

/* ---------- install as an app (site build only) ---------- */
function initInstall(){
  if (!window.PWA) return;
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  if (standalone) return;
  const snoozed = store.get("installSnooze", 0); if (Date.now() - snoozed < 7 * 864e5) return;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  let deferred = null;
  const show = html => setTimeout(() => {
    if (document.getElementById("installBar")) return;
    const bar = document.createElement("div"); bar.id = "installBar"; bar.className = "installbar"; bar.setAttribute("role", "dialog"); bar.setAttribute("aria-label", "התקנת האפליקציה");
    bar.innerHTML = `<img src="icons/icon-192.png" alt=""><div class="ib-text">${html}</div><button class="ib-x" aria-label="לא עכשיו">×</button>`;
    bar.querySelector(".ib-x").onclick = () => { store.set("installSnooze", Date.now()); bar.remove(); };
    const go = bar.querySelector("[data-install]"); if (go) go.onclick = async () => { if (!deferred) return; deferred.prompt(); const r = await deferred.userChoice.catch(() => null); deferred = null; bar.remove(); if (r && r.outcome === "accepted") toast("CityCat הותקנה במסך הבית"); };
    $("#app").appendChild(bar);
  }, 3400);
  if (ios){
    show(`<b>התקן את CityCat באייפון</b><span>לחץ על <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-3px"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg> שיתוף בספארי, ואז "הוספה למסך הבית"</span>`);
  } else {
    addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; show(`<b>התקן את CityCat</b><span>אפליקציה במסך הבית, נפתחת במסך מלא</span><button class="btn ginger" data-install style="padding:8px 14px;margin-top:6px">התקנה</button>`); });
  }
  addEventListener("appinstalled", () => { const b = document.getElementById("installBar"); if (b) b.remove(); });
}

/* ---------- boot ---------- */
function bootDemo(){
  S.demo = true; $("#demoFlag").hidden = false;
  const saved = store.get("demo", null), d = saved || demoData();
  S.cats = d.cats; S.reports = d.reports; S.stations = d.stations;
  S.me = { ...S.me, ...store.get("me", {}) };
  S.uid = store.get("uid", null) || (() => { const u = "guest-" + uidShort(); store.set("uid", u); return u; })();
  S.admin = true;
  renderAll();
}
/* splash */
(() => { const sp = $("#splash"); if (!sp) return; $("#spCat").innerHTML = catAvatar({ id:"TLV-0001", name:"סלפי", hex:"#d9822b", color:"ג׳ינג׳י", pattern:"טאבי", marks:"פס לבן על החזה", neutered:true });
  const done = () => sp.remove(); sp.onclick = done; setTimeout(done, reduceMotion ? 1200 : 3100); })();
if (window.REAL_MAP && window.L) initRealMap(); else drawBase();
renderLayers(); renderLegend(); fitVB(); updatePickHint();
bootDemo();
initInstall();
(async () => {
  const [db, sample, user] = await Promise.all([use("db"), use("sample"), use("user")]);
  S.sample = sample;
  if (S.view === "scan") renderScanIdle();
  if (!db) return;
  S.db = db; S.user = user; S.demo = false; $("#demoFlag").hidden = true;
  S.uid = (user && await user.id().catch(() => null)) || S.uid;
  S.admin = user ? await user.canEdit().catch(() => false) : false;
  S.cats = []; S.reports = []; S.stations = []; S.me = { points:0, scans:0, newCats:0, reports:0, games:0, best:0 };
  const sub = (col, fn) => db.collection(col).onSnapshot(q => { S[col] = q.docs.map(d => d.data()); fn && fn(); renderAll(); }, () => {});
  sub("cats"); sub("reports"); sub("stations");
  db.collection("players").onSnapshot(async q => {
    S.players = {}; q.docs.forEach(d => { const v = d.data(); S.players[v.uid || d.id] = v; });
    const mine = S.players[S.uid]; if (mine) S.me = { ...S.me, ...mine };
    if (user){ try { const ps = await user.profiles(Object.keys(S.players)); for (const id in ps) S.names[id] = ps[id].name || ""; } catch {} }
    renderAll();
  }, () => {});
  renderAll();
})();
</script>
